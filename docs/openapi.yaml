openapi: 3.0.3
info:
  title: QuestDrop API
  version: 1.0.0
  description: >
    Trade half-finished quests. Single modular-monolith binary; the bot (B)
    reuses these exact endpoints. Errors follow RFC 9457 (Problem Details).
servers:
  - url: http://localhost:3000
paths:
  /v1/auth/request:
    post:
      summary: Request a magic-link email (15-min token, LogMailer unless SMTP_URL set)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string}
                handle: {type: string}
      responses:
        '200':
          description: sent flag (always true, no existence leak)
        '400':
          $ref: '#/components/responses/Problem'
  /v1/auth/callback:
    post:
      summary: Redeem a token for an HttpOnly session cookie (single-use)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        '200':
          description: user_id + Set-Cookie
        '401':
          $ref: '#/components/responses/Problem'
  /v1/me:
    get:
      summary: Session identity (401 without a valid cookie)
      responses:
        '200':
          description: user_id, handle, email
        '401':
          $ref: '#/components/responses/Problem'
  /:
    get:
      summary: Home page (Askama HTML with pool count)
      responses:
        '200':
          description: html
  /voice/{file}:
    get:
      summary: Local static mp3 files
      parameters:
        - {name: file, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: mp3 bytes
        '404':
          description: no such file
  /health:
    get:
      summary: Liveness + database state (always 200)
      responses:
        '200':
          description: ok
  /ready:
    get:
      summary: Readiness probe (503 unless the database answers)
      responses:
        '200':
          description: ready
        '503':
          description: not ready
  /v1/projects:
    get:
      summary: OPEN pool, newest first, cursor pages (limit default 20, max 50)
      parameters:
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer}}
      responses:
        '200':
          description: pool page + next_cursor
        '400':
          $ref: '#/components/responses/Problem'
    post:
      summary: Drop a quest (validation, 3/day per giver, 10/min per IP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Drop'
      responses:
        '201':
          description: frozen (project + open offer + outbox event)
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/users/upsert:
    post:
      summary: Create or update OWN skill profile, LOGIN REQUIRED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        '200':
          description: user_id
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/match:
    get:
      summary: Top-3 + 1 surprise from the OPEN pool (RuleMatcher)
      parameters:
        - {name: user_id, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: ranked matches
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/swaps:
    post:
      summary: Atomic take, LOGIN REQUIRED (taker_id must equal session user)
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, maxLength: 64}
          description: Same key + same body replays stored 200; same key + different body is 400
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Swap'
      responses:
        '201':
          description: swapped
        '200':
          description: 'idempotent replay (Idempotent-Replayed: true)'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /v1/revive:
    get:
      summary: All completed takes, newest first, with freeze package + first 2-min task
      parameters:
        - {name: user_id, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: revives list
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/reports:
    post:
      summary: Report a project, LOGIN REQUIRED (reporter must equal session user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Report'
      responses:
        '201':
          description: recorded (+hidden flag)
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: RFC 9457 problem object
  schemas:
    Drop:
      type: object
      required: [handle, email, title, one_liner, link_url, voice_url, time_bucket, energy]
      properties:
        handle: {type: string}
        email: {type: string}
        title: {type: string}
        one_liner: {type: string}
        link_url: {type: string}
        voice_url: {type: string, description: '/voice/*.mp3 path or http(s) mp3 URL'}
        skill_needed: {type: array, items: {type: string}}
        time_bucket: {type: string, enum: [S, M, L]}
        energy: {type: string, enum: [LOW, MID, HIGH]}
    Profile:
      type: object
      required: [handle, email]
      properties:
        handle: {type: string}
        email: {type: string}
        can_do: {type: array, items: {type: string}}
        looking_for: {type: array, items: {type: string}}
    Swap:
      type: object
      required: [taker_id, give_offer_id, take_offer_id]
      properties:
        taker_id: {type: string, format: uuid}
        give_offer_id: {type: string, format: uuid}
        take_offer_id: {type: string, format: uuid}
    Report:
      type: object
      required: [reporter_id, project_id, reason]
      properties:
        reporter_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        reason: {type: string, minLength: 10, maxLength: 300}
