openapi: 3.0.3
info:
  title: QuestDrop API
  version: 1.0.0
  description: >
    Trade half-finished quests. Single modular-monolith binary. Errors follow
    RFC 9457 (Problem Details). Hand-written; last checked against the code
    on 2026-10-12.

    Login = a valid `qd_session` cookie from /v1/auth/callback. Every POST
    except /v1/auth/callback and /v1/auth/logout is rate limited to 10
    requests per minute per client IP (leftmost X-Forwarded-For), answering
    429 with Retry-After. Without a database every DB-backed route answers 503.
    Unknown paths answer a JSON 404 (browsers asking for text/html get the
    web UI's 404 page), wrong methods a JSON 405, and a trailing slash is
    redirected with 308.

    The web UI (/, /login, /drop, /match, /take/{offer_id}, /revive, /me,
    /q/{id}) is server-rendered HTML in the same binary and is described in
    docs/web-ui.md, not here.
servers:
  - url: http://localhost:3000
paths:
  /:
    get:
      summary: Web UI pool page (HTML; see docs/web-ui.md)
      responses:
        '200':
          description: html
  /health:
    get:
      summary: Liveness + database state (always 200)
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  db: {type: string, enum: [up, down]}
  /ready:
    get:
      summary: Readiness probe (503 unless the database answers)
      responses:
        '200':
          description: '{"ready": true}'
        '503':
          description: '{"ready": false}'
  /v1/auth/request:
    post:
      summary: Request a magic-link email (15-min single-use token)
      description: >
        Sends `BASE_URL/login?token=...` through SMTP (when SMTP_URL is set)
        or writes it to the log. The web UI's /login page shows a button that
        redeems the token; API clients POST it to /v1/auth/callback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string}
                handle: {type: string, description: 'used only when a new user is created'}
      responses:
        '200':
          description: '{"sent": true} (always true, no existence leak)'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/auth/callback:
    post:
      summary: Redeem a token for an HttpOnly session cookie (single-use)
      description: >
        Creates the user on first login (handle from the request or derived
        from the email). Sets `qd_session` (30 days, HttpOnly, SameSite=Lax,
        Secure when BASE_URL is https).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        '200':
          description: '{"user_id": uuid} + Set-Cookie'
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/auth/logout:
    post:
      summary: Destroy the session (idempotent, clears the cookie)
      responses:
        '200':
          description: '{"logged_out": true}'
  /v1/me:
    get:
      summary: Session identity (LOGIN REQUIRED)
      responses:
        '200':
          description: '{"user_id", "handle", "email"}'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /v1/me/offers:
    get:
      summary: Every quest the session user dropped, newest first (LOGIN REQUIRED)
      description: >
        OPEN items carry `offer_id`, which is what POST /v1/swaps needs as
        `give_offer_id`. Status shows where each quest is now.
      responses:
        '200':
          description: own quests
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items:
                      allOf:
                        - {$ref: '#/components/schemas/PoolRow'}
                        - type: object
                          properties:
                            status: {type: string, enum: [OPEN, MATCHED, CLOSED]}
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/voice:
    post:
      summary: Upload a voice note (LOGIN REQUIRED)
      description: >
        5 MB cap. Accepts mp3 (ID3 / MPEG frame sync) and what browsers record
        natively: Opus in ogg (`OggS`) or webm (EBML), AAC in mp4 (`ftyp`).
        Stored under a random name with the sniffed extension (.mp3, .ogg,
        .webm, .m4a). Duration is NOT checked server-side; the web recorder
        enforces 10-60 s. Refused with 507 once VOICE_DIR reaches
        VOICE_QUOTA_MB (default 500).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: '{"voice_url": "/voice/<uuid>.<mp3|ogg|webm|m4a>"}'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '507':
          $ref: '#/components/responses/Problem'
  /voice/{file}:
    get:
      summary: Stored voice files
      parameters:
        - {name: file, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: audio bytes
        '404':
          description: no such file
  /v1/projects:
    get:
      summary: OPEN pool, newest first, cursor pages (limit default 20, max 50)
      description: >
        Items carry the project `id` and its OPEN `offer_id` (what POST
        /v1/swaps takes as `take_offer_id`).
      parameters:
        - {name: cursor, in: query, schema: {type: string, format: uuid}, description: 'last project id of the previous page; unknown ids restart from the top'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200':
          description: pool page
          content:
            application/json:
              schema:
                type: object
                properties:
                  pool:
                    type: array
                    items: {$ref: '#/components/schemas/PoolRow'}
                  next_cursor: {type: string, format: uuid, nullable: true}
        '400':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    post:
      summary: Drop a quest (LOGIN REQUIRED; max 3 per giver in any 24 h)
      description: >
        The giver is the session user. `handle` and `email` may be omitted;
        if sent they must match the session (else 403), so nobody can drop
        in someone else's name. One transaction writes the project, its open
        offer and a `swap.created` outbox event. A `/voice/...` voice_url
        must point at an existing file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Drop'
      responses:
        '201':
          description: frozen
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id: {type: string, format: uuid}
                  offer_id: {type: string, format: uuid}
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          description: daily cap (Retry-After = seconds until the oldest counted drop expires) or IP rate limit
        '503':
          $ref: '#/components/responses/Problem'
  /v1/projects/{id}:
    get:
      summary: One project by id (OPEN or MATCHED; reported-away ones are 404)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: project
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/PoolRow'}
                  - type: object
                    properties:
                      status: {type: string, enum: [OPEN, MATCHED]}
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/users/upsert:
    post:
      summary: Update OWN skill profile (LOGIN REQUIRED)
      description: handle + email must equal the session user's, else 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        '200':
          description: '{"user_id": uuid}'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/match:
    get:
      summary: Rank the OPEN pool for the session user (LOGIN REQUIRED)
      description: >
        Matches reveal a skill profile, so only the session owner may ask.
        `user_id` is optional; if given it must equal the session user (403).
        Considers up to 100 of the newest OPEN projects not owned by the user.
        `rule` (default) returns top-3 + 1 random surprise, score = 0.8 x skill
        fit + 0.2 x random; time_bucket and energy are not scored.
        `embedding` returns the top 4 by trigram cosine, deterministic.
        Item `id` is a PROJECT id; `offer_id` is its OPEN offer.
      parameters:
        - {name: user_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: algo, in: query, required: false, schema: {type: string, enum: [rule, embedding], default: rule}}
      responses:
        '200':
          description: ranked matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  matches:
                    type: array
                    items: {$ref: '#/components/schemas/RankedItem'}
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/swaps:
    post:
      summary: Atomic two-way trade (LOGIN REQUIRED, taker_id must equal the session user)
      description: >
        The taker gives one of their own OPEN offers and takes another user's
        OPEN offer. Both offers and both projects become MATCHED, a match row
        and a `swap.completed` outbox event are written.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string, maxLength: 64}
          description: Same key + same body replays the stored response with 200; same key + different body is 400
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Swap'
      responses:
        '201':
          description: swapped
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SwapResult'}
        '200':
          description: 'idempotent replay (header Idempotent-Replayed: true)'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: same offer twice, offer no longer open, give offer not yours, or take offer is yours
        '429':
          $ref: '#/components/responses/Problem'
  /v1/revive:
    get:
      summary: The session user's completed takes, newest first, with freeze package + first 2-min task (LOGIN REQUIRED)
      parameters:
        - {name: user_id, in: query, required: false, schema: {type: string, format: uuid}, description: 'optional; must equal the session user (403)'}
      responses:
        '200':
          description: revives list
          content:
            application/json:
              schema:
                type: object
                properties:
                  revives:
                    type: array
                    items: {$ref: '#/components/schemas/Revive'}
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          description: no completed swaps yet
        '503':
          $ref: '#/components/responses/Problem'
  /v1/reports:
    post:
      summary: Report a project (LOGIN REQUIRED, reporter_id must equal the session user)
      description: One report per reporter per project; the third distinct report sets the project and its open offers to CLOSED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Report'
      responses:
        '201':
          description: '{"report_id": uuid, "hidden": bool}'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          description: already reported, or reporting your own project
        '429':
          $ref: '#/components/responses/Problem'
components:
  responses:
    Problem:
      description: RFC 9457 problem object
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      properties:
        type: {type: string, example: 'about:blank'}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        errors: {type: array, items: {type: string}, description: 'every failed validation rule'}
    Drop:
      type: object
      required: [title, one_liner, link_url, voice_url, time_bucket, energy]
      properties:
        handle: {type: string, pattern: '^[a-z0-9_]{3,24}$', description: 'optional; must equal the session user'}
        email: {type: string, maxLength: 254, description: 'optional; must equal the session user'}
        title: {type: string, minLength: 3, maxLength: 80}
        one_liner: {type: string, minLength: 10, maxLength: 200}
        link_url: {type: string, maxLength: 2048, description: 'http(s) URL'}
        voice_url: {type: string, maxLength: 2048, description: '/voice/* path or http(s) URL whose path ends in .mp3, .ogg, .opus, .webm or .m4a'}
        skill_needed: {type: array, items: {type: string, maxLength: 32}, description: 'lowercased, deduplicated, first 10 kept'}
        time_bucket: {type: string, enum: [S, M, L], description: 'case-insensitive; S <2h, M 2-8h, L >8h'}
        energy: {type: string, enum: [LOW, MID, HIGH], description: case-insensitive}
    Profile:
      type: object
      required: [handle, email]
      properties:
        handle: {type: string, pattern: '^[a-z0-9_]{3,24}$'}
        email: {type: string}
        can_do: {type: array, items: {type: string, maxLength: 32}, description: 'first 20 kept'}
        looking_for: {type: array, items: {type: string, maxLength: 32}, description: 'first 20 kept'}
    Swap:
      type: object
      required: [taker_id, give_offer_id, take_offer_id]
      properties:
        taker_id: {type: string, format: uuid}
        give_offer_id: {type: string, format: uuid, description: "one of the taker's OPEN offers"}
        take_offer_id: {type: string, format: uuid, description: "another user's OPEN offer"}
    SwapResult:
      type: object
      properties:
        match_id: {type: string, format: uuid}
        give_offer_id: {type: string, format: uuid}
        take_offer_id: {type: string, format: uuid}
        project_given: {type: string, format: uuid}
        project_taken: {type: string, format: uuid}
        score: {type: number, description: 'deterministic skill fit 0..1'}
    Report:
      type: object
      required: [reporter_id, project_id, reason]
      properties:
        reporter_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        reason: {type: string, minLength: 10, maxLength: 300}
    PoolRow:
      type: object
      properties:
        id: {type: string, format: uuid, description: project id}
        title: {type: string}
        one_liner: {type: string}
        link_url: {type: string}
        voice_url: {type: string}
        skill_needed: {type: array, items: {type: string}}
        time_bucket: {type: string, enum: [S, M, L]}
        energy: {type: string, enum: [LOW, MID, HIGH]}
        giver_handle: {type: string}
        created_at: {type: string, format: date-time}
        offer_id: {type: string, format: uuid, nullable: true, description: 'OPEN offer of this project; null once matched or closed'}
    RankedItem:
      type: object
      properties:
        id: {type: string, description: project id}
        skill_needed: {type: array, items: {type: string}}
        time_bucket: {type: string}
        energy: {type: string}
        score: {type: number}
        reason: {type: string, example: 'fit=0.50 rand=0.31'}
        offer_id: {type: string, format: uuid, nullable: true}
    Revive:
      type: object
      properties:
        match_id: {type: string, format: uuid}
        matched_at: {type: string, format: date-time}
        project: {$ref: '#/components/schemas/PoolRow'}
        first_task:
          type: object
          properties:
            title: {type: string}
            minutes: {type: integer, example: 2}
            steps: {type: array, items: {type: string}}
